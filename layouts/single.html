<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    {{ template "header.html" . }}

    <article>
        <h1>{{ .Title }}</h1>
        <time>{{ .Date }}</time>
        <div class="content">
            {{ .Body | safeHTML }}
        </div>
    </article>
    </div>

    <footer>
        <div class="left">
            <p>&copy; {{ now | dateFormat "2006" }} {{ .Site.Title }}</p>
        </div>
    </footer>
</body>
</html>
