<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>radhitya - blog</title>
<style>
body { max-width: 600px; margin: 8em auto; line-height: 1.8; font: 18px serif; color: #333; padding: 0 1em; }
a { color: #333; }
table { width: 100%; }
tr td:nth-child(2) { text-align: right; white-space: nowrap; }
nav { text-align: center; margin-top: 2em; }
nav a { margin: 0 0.5em; }
@media (max-width: 640px) {
  body { margin: 2em auto; font-size: 16px; }
  table, tbody, tr { display: block; }
  tr { height: auto; margin-bottom: 0.5em; }
  td { display: inline; }
  td:first-child::after { content: " \2013 "; }
}
</style>
</head>
<body>
<main>
<h3>Posts</h3>
<table>
{{range .posts}}
<tr>
<td><a href="/{{.url}}">{{.title}}</a></td>
<td>{{.date}}</td>
</tr>
{{end}}
</table>
<nav>{{.nav}}</nav>
</main>
</body>
</html>
